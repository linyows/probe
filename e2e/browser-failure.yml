name: Browser Failure Evidence
description: |
  Waits for an element the fixture page does not have, so that e2e/test.yml
  can check the page is saved when the browser action fails.
  This workflow is expected to fail with an action error.
vars:
  url: "{{ URL ?? 'http://localhost:8090' }}"
  evidence_dir: "{{ EVIDENCE_DIR ?? '/tmp/probe-browser-evidence' }}"
jobs:
- name: Missing element
  steps:
  - name: Waits for an element that is not there
    uses: browser
    with:
      headless: true
      timeout: 15s
      evidence_dir: "{{vars.evidence_dir}}"
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: wait_visible
        selector: "#not-on-the-page"
    test: res.code == 0
