name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to a pull request supersedes the run in progress. Every other
# run gets a group of its own, so that no push to main is skipped.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version-file: go.mod
    - name: Run test
      run: make test
    - name: Run db test without cgo, as releases are built
      run: go test ./actions/db/...
      env:
        CGO_ENABLED: "0"
    - name: Run octocov
      uses: k1LoW/octocov-action@73d561f65d59e66899ed5c87e4621a913b5d5c20 # v1.5.0

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version-file: go.mod
    - name: golangci-lint
      uses: reviewdog/action-golangci-lint@f9bba13753278f6a73b27a56a3ffb1bfda90ed71 # v2.8.0

  # Builds probe for every platform .goreleaser.yaml releases, the way it does,
  # so that a release does not fail on a platform the tests do not run on.
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version-file: go.mod
    - name: Go build
      env:
        CGO_ENABLED: "0"
      run: |
        for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
          echo "::group::$platform"
          GOOS=${platform%/*} GOARCH=${platform#*/} go build -o /dev/null ./cmd/probe
          echo "::endgroup::"
        done
