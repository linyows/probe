name: End-to-end Tests

on:
  workflow_dispatch:
    inputs:
      options:
        description: 'Additional options for probe (e.g., --verbose)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yml'
  # The tests use no secrets, so they run on pull requests from forks and
  # Dependabot as well, with a read-only token.
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'e2e/**'
      - 'examples/**'
      - '.github/workflows/e2e.yml'

# A newer push to a pull request supersedes the run in progress. Every other
# run gets a group of its own: a group holds one pending run at most, so a
# shared one would drop a push to main that was waiting behind another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y protobuf-compiler xvfb x11-utils
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@b94431e051d1c52dcbe9a7092a4f10f827795416 # latest
    - name: Setup go
      uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
      with:
        go-version-file: go.mod
    - name: Run probe
      uses: mozership/probe-action@58e59821ea0c348da201080736ddcdb2b3cd3313 # v1.2.1
      with:
        path: e2e/test.yml
        options: ${{ github.event.inputs.options }}
