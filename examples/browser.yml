name: Browser Examples
description: |
  Minimal test to verify browser can start.
  Serve the fixture page first: make browser_server

vars:
  ci: "{{ CI ?? '' }}"
  url: "{{ URL ?? 'http://localhost:8090' }}"

jobs:
- name: Get element text
  steps:
  - name: Simple Navigation Test
    uses: browser
    with:
      headless: true
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: wait_visible
        selector: h1
      - name: text
        id: heading
        selector: "h1"
    test: res.code == 0 && res.results.heading == "Probe Browser Fixture"
    echo: |
      Heading: {{res.results.heading}}
      -----
    outputs:
      load_time: rt.duration

- name: Capture screenshot
  steps:
  - name: Fixture page
    uses: browser
    with:
      window_w: 1280
      window_h: 800
      headless: "{{ vars.ci != '' }}"
      timeout: 1m
      actions:
      - name: navigate
        url: "{{vars.url}}/"
      - name: capture_screenshot
        path: ./e2e/capture_screenshot.png
      - name: full_screenshot
        id: full_page
    test: res.code == 0 && res.filepaths.full_page endsWith ".png"
    echo: "Full page: {{res.filepaths.full_page}}"
