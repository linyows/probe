syntax = "proto3";
package pb;
option go_package = "./pb";

import "google/protobuf/struct.proto";

message RunRequest {
    reserved 1;
    reserved "args";
    google.protobuf.Struct with = 2;
}

message RunResponse {
    reserved 2;
    reserved "error";
    google.protobuf.Struct result = 1;
}

service Actions {
    rpc Run(RunRequest) returns (RunResponse);
}
